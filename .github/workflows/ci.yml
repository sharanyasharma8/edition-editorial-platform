name: EDITION CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: edition-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-please-never-use-in-production-0123456789
      DATABASE_URL: postgresql://edition:ci_only_password@127.0.0.1:5432/edition?schema=public
      EDITION_USE_DB: "false"
      AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests and coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload Next build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-next-build
          path: .next
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unit-test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  ai-quality:
    name: AI service contract and evaluation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r services/ai/requirements.txt
      - name: Contract tests
        working-directory: services/ai
        run: pytest -q
      - name: Deterministic evaluation contract
        working-directory: services/ai
        run: python evaluate.py

  browser-e2e:
    name: Browser E2E against PostgreSQL
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edition
          POSTGRES_PASSWORD: edition_ci_password
          POSTGRES_DB: edition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edition -d edition"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-only-session-secret-please-never-use-in-production-0123456789
      EDITION_USE_DB: "true"
      DATABASE_URL: postgresql://edition:edition_ci_password@127.0.0.1:5432/edition?schema=public
      CRON_SECRET: edition-ci-cron-secret
      AI_PROVIDER: demo
      COOKIE_SECURE: "false"
      ENABLE_DEMO_AUTH: "true"
      DEMO_EDITOR_EMAIL: editor@edition.studio
      DEMO_EDITOR_PASSWORD: edition-demo-pass
      DEMO_AUTHOR_EMAIL: author@edition.studio
      DEMO_AUTHOR_PASSWORD: edition-demo-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-playwright-results-postgresql
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-compose-smoke:
    name: Docker Compose integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start all services
        run: docker compose up --build --detach --wait
      - name: Check application readiness
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/api/health
      - name: Verify seeded editor can authenticate
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/login.json --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3000/api/auth/login \
            --header 'Origin: http://localhost:3000' \
            --header 'Content-Type: application/json' \
            --data '{"email":"editor@edition.studio","password":"edition-demo-pass"}')
          test "$status" = "200"
          grep -q '"role":"EDITOR"' /tmp/login.json
      - name: Verify published-only GraphQL query
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:3000/api/graphql \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ articles { id status } }"}' \
            > /tmp/graphql.json
          python -c 'import json; d=json.load(open("/tmp/graphql.json")); assert d.get("data", {}).get("articles"); assert all(a["status"] == "PUBLISHED" for a in d["data"]["articles"])'
      - if: always()
        name: Collect service logs
        run: docker compose logs --no-color > /tmp/edition-compose.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-compose-logs
          path: /tmp/edition-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose down --volumes --remove-orphans

  storybook:
    name: Storybook production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build-storybook

  lighthouse:
    name: Lighthouse lab measurements
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-please-never-use-in-production-0123456789
      EDITION_USE_DB: "false"
      AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - name: Run repeatable Lighthouse lab audits
        run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-lighthouse-reports
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 30

  infrastructure-validate:
    name: Terraform configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check Terraform formatting
        run: terraform -chdir=infra/aws/terraform fmt -check -recursive
      - name: Initialize provider plugins without configuring remote state
        run: terraform -chdir=infra/aws/terraform init -backend=false -input=false
      - name: Validate AWS infrastructure
        run: terraform -chdir=infra/aws/terraform validate
